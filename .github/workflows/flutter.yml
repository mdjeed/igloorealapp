name: Flutter APK Debug Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # تثبيت dependencies
      - name: Get dependencies
        run: flutter pub get

      # تنظيف المشروع
      - name: Clean project
        run: flutter clean

      # بناء APK (DEBUG ✅)
      - name: Build APK
        run: flutter build apk --debug

      # عرض الملفات (للتأكد)
      - name: Show APK files
        run: ls -R build/app/outputs/

      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk